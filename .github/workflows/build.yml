name: Build

on:
  workflow_dispatch:        
  push:
    tags: ["v0.1.0"]            

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: GutenRead-windows
            flags: --onefile --windowed
            artifact: dist/GutenRead-windows.exe
          - os: macos-latest
            name: GutenRead-macos
            flags: --windowed
            artifact: dist/GutenRead-macos.zip
          - os: ubuntu-latest
            name: GutenRead-linux
            flags: --onefile
            artifact: dist/GutenRead-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install -r requirements-dev.txt
      - name: Build
        run: pyinstaller --noconfirm --name GutenRead ${{ matrix.flags }} run.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/GutenRead.exe dist/GutenRead-windows.exe
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/GutenRead.app dist/GutenRead-macos.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/GutenRead-linux.tar.gz -C dist GutenRead
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
